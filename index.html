<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tax App — Landlord Income & Tax Tracker</title>
    <meta name="description" content="Personal UK landlord property income and expense tracking tool for HMRC Making Tax Digital (MTD).">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1320;
            --card-bg: #131f33;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: rgba(19, 31, 51, 0.8);
            border-bottom: 1px solid var(--border);
        }
        .brand {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-left: 1.5rem;
        }
        .nav-links a:hover {
            color: #ffffff;
        }
        .container {
            max-width: 680px;
            margin: 4rem auto;
            padding: 0 1.5rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
        }
        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            color: #ffffff;
        }
        p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .footer {
            text-align: center;
            margin-top: 4rem;
            padding-bottom: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .footer a {
            color: #38bdf8;
            text-decoration: none;
            margin: 0 0.5rem;
        }
    </style>
</head>
<body>

    <nav>
        <span class="brand">My Tax App</span>
    </nav>

    <div class="container">
        <div class="card">
            <h1>My Tax App</h1>
            <p>A personal property income and expense record-keeping tool built for managing my UK rental income, allowable expense receipts, and HMRC Making Tax Digital (MTD) quarterly submissions.</p>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 My Tax App | <a href="terms.html">Terms of Use</a> | <a href="privacy.html">Privacy Policy</a></p>
    </div>

</body>
</html>
